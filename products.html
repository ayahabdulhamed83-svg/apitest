<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="products-style.css">
    <title>إدارة المنتجات</title>
</head>
<body>

    <div class="container">
        <header>
            <h1>إدارة المنتجات</h1>
            <button class="btn-add" onclick="openModal('addModal')">إضافة منتج جديد +</button>
        </header>

        <!-- جدول المنتجات -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>التصنيف</th>
                        <th>السعر</th>
                        <th>الكمية</th>
                        <th>الوصف</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <!-- سيتم ملء البيانات هنا بواسطة JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Popup: إضافة منتج -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3>إضافة منتج جديد</h3>
            <input type="text" id="addName" placeholder="اسم المنتج">
            <input type="text" id="addPrice" placeholder="السعر">
            <input type="number" id="addQuantity" placeholder="الكمية">
            <input type="text" id="addCategoryId" placeholder="ID التصنيف">
            <textarea id="addDescription" placeholder="الوصف"></textarea>
            <div class="actions">
                <button onclick="createProduct()">حفظ المنتج</button>
                <button onclick="closeModal('addModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Popup: تعديل منتج -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>تعديل المنتج</h3>
            <input type="hidden" id="editId">
            <input type="text" id="editName" placeholder="اسم المنتج">
            <input type="text" id="editPrice" placeholder="السعر">
            <input type="number" id="editQuantity" placeholder="الكمية">
            <input type="text" id="editCategoryId" placeholder="ID التصنيف">
            <textarea id="editDescription" placeholder="الوصف"></textarea>
            <div class="actions">
                <button onclick="updateProduct()">تحديث البيانات</button>
                <button onclick="closeModal('editModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Popup: تأكيد الحذف -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3>حذف منتج</h3>
            <p>هل أنت متأكد من حذف هذا المنتج نهائياً؟</p>
            <input type="hidden" id="deleteId">
            <div class="actions">
                <button class="btn-danger" onclick="confirmDelete()">نعم، احذف</button>
                <button onclick="closeModal('deleteModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="products-script.js"></script>
</body>
</html>
